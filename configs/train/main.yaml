train:
  task: field
  epochs: 50
  # Throughput is flat across 512-2048 on the unified cache; 512 keeps VRAM low.
  batch_size: 512
  learning_rate: 0.001
  weight_decay: 0.0001
  warmup_ratio: 0.05
  grad_clip: 1.0
  amp: true
  beta: 8.0
  lambda_pol: 0.5
  lambda_inv: 0.1
  inv_batch_prob: 0.25
  patience: 10
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  seed: 36
  device: cuda

dataset:
  window_length: 400
  sigma: 10.0
  jitter: [120, 280]
  augment:
    p_noise: 0.35
    snr_db_range: [0.0, 30.0]
    p_invert: 0.5
    p_scale: 0.2
    scale_range: [0.5, 2.0]

output:
  dir: outputs/runs/sopnet_full
