[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sopnet"
version = "0.1.0"
description = "SOPNet: Signed-Onset Polarity Network for P-wave first-motion polarity picking"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.10"
authors = [{ name = "SOPNet contributors" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.2",
    "pyarrow>=14.0",
    "scipy>=1.10",
    "h5py>=3.10",
    "torch>=2.1",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.6",
]
baselines = [
    "seispolarity>=0.1.4",
]

[tool.setuptools.packages.find]
include = ["sopnet*"]
exclude = ["outputs*", "scripts*", "tests*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
